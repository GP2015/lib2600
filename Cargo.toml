[workspace]
resolver = "3"
members = ["emucore", "mappers"]

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
todo = "warn"

[workspace.dependencies]
arrayvec = { version = "0.7.8", default-features = false }
derive_more = { version = "2.1.1", default-features = false, features = [
    "deref",
    "deref_mut",
] }
itertools = { version = "0.15.0", default-features = false }
pastey = "0.2.3"
rstest = "0.29.0"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.21", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
